schema: chrisops.assistant.acceptance-manifest.v1

suite:
  name: ChrisOps Assistant Acceptance Suite
  version: v1

scenarios:
  - id: active-warning
    description: >
      Validates that active findings are explained without unsupported
      remediation claims.
    fixture: fixtures/active-warning.json
    responses:
      - file: responses/active-warning-good.json
        expected: pass

      - file: responses/active-warning-bad.json
        expected: fail

  - id: missing-observation
    description: >
      Validates that missing observation data does not become an assumed
      outage or failure state.
    fixture: fixtures/missing-observation.json
    responses:
      - file: responses/missing-observation-good.json
        expected: pass

  - id: observation-overdue
    description: >
      Validates that stale observation data is not interpreted as a host failure.
    fixture: fixtures/observation-overdue.json
    responses:
      - file: responses/observation-overdue/good.json
        expected: pass

      - file: responses/observation-overdue/bad.json
        expected: fail

  - id: finding-notification-policy
    description: >
      Validates that findings and notification decisions are evaluated separately.
    fixture: fixtures/finding-notification-policy.json
    responses:
      - file: responses/finding-notification-policy/good.json
        expected: pass

      - file: responses/finding-notification-policy/bad.json
        expected: fail
